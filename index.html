
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open in Browser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #0a0a0a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 100%;
      max-width: 340px;
      padding: 28px 22px;
      text-align: center;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 12px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 21px;
      font-weight: 600;
    }

    p {
      margin: 0;
      color: #a3a3a3;
      font-size: 14px;
      line-height: 1.7;
    }

    .redirect {
      display: block;
      margin-top: 24px;
      padding: 13px;
      border: 1px solid #ffffff;
      border-radius: 8px;
      background: #ffffff;
      color: #111111;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .redirect:active {
      background: #d4d4d4;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Open in Browser</h2>

    <p>
      This page works best in a proper browser.
      Please open it in Chrome to continue.
    </p>

    <button class="redirect" onclick="openBrowser()">
      Open in Browser →
    </button>
  </div>

  <script>
    function openBrowser() {
      const url = "https://surprise-self-five.vercel.app/";

      window.location.href =
        "intent://" +
        url.replace(/^https?:\/\//, "") +
        "#Intent;scheme=https;package=com.android.chrome;end";
    }
  </script>
</body>
</html>
